

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Inscripción - Taller Web</title>
</head>

<body>

    <h1>Formulario de Inscripción al Taller de Desarrollo Web</h1>

    <form action="#" method="post">

        <!-- SECCIÓN 1 -->
        <fieldset>
            <legend>Datos Personales</legend>

            <label for="nombre">Nombres y Apellidos:</label><br>
            <input 
                type="text" 
                id="nombre" 
                name="nombre" 
                required 
                minlength="3" 
                maxlength="80"
                placeholder="Ingrese sus nombres y apellidos">
            <br><br>

            <label for="correo">Correo Electrónico:</label><br>
            <input 
                type="email" 
                id="correo" 
                name="correo" 
                required 
                placeholder="ejemplo@correo.com">
            <br><br>

            <label for="telefono">Número de Teléfono:</label><br>
            <input 
                type="tel" 
                id="telefono" 
                name="telefono"
                placeholder="0999999999"
                pattern="[0-9]{10}"
                required>
            <br><br>

            <label for="edad">Edad:</label><br>
            <input 
                type="number" 
                id="edad" 
                name="edad"
                min="15"
                max="80"
                step="1"
                required>
            <br><br>

            <label for="fechaNacimiento">Fecha de Nacimiento:</label><br>
            <input 
                type="date" 
                id="fechaNacimiento" 
                name="fechaNacimiento"
                required>
        </fieldset>

        <br>

        <!-- SECCIÓN 2 -->
        <fieldset>
            <legend>Datos Académicos</legend>

            <label for="carrera">Carrera o Curso:</label><br>
            <input 
                type="text" 
                id="carrera" 
                name="carrera"
                required
                placeholder="Ejemplo: Ingeniería en Sistemas">
            <br><br>

            <label for="nivelAcademico">Nivel Académico:</label><br>
            <select id="nivelAcademico" name="nivelAcademico" required>
                <option value="">Seleccione una opción</option>
                <option value="bachillerato">Bachillerato</option>
                <option value="tecnologico">Tecnológico</option>
                <option value="universitario">Universitario</option>
                <option value="posgrado">Posgrado</option>
            </select>
            <br><br>

            <label for="institucion">Institución Educativa:</label><br>
            <input 
                type="text" 
                id="institucion" 
                name="institucion"
                minlength="3"
                maxlength="100"
                placeholder="Nombre de la institución">
        </fieldset>

        <br>

        <!-- SECCIÓN 3 -->
        <fieldset>
            <legend>Preferencias del Taller</legend>

            <p><strong>Modalidad del Taller:</strong></p>

            <input 
                type="radio" 
                id="presencial" 
                name="modalidad" 
                value="presencial"
                required>
            <label for="presencial">Presencial</label>

            <input 
                type="radio" 
                id="virtual" 
                name="modalidad" 
                value="virtual">
            <label for="virtual">Virtual</label>

            <input 
                type="radio" 
                id="hibrida" 
                name="modalidad" 
                value="hibrida">
            <label for="hibrida">Híbrida</label>

            <br><br>

            <p><strong>Temas de Interés:</strong></p>

            <input type="checkbox" id="html" name="temas" value="HTML">
            <label for="html">HTML</label><br>

            <input type="checkbox" id="css" name="temas" value="CSS">
            <label for="css">CSS</label><br>

            <input type="checkbox" id="javascript" name="temas" value="JavaScript">
            <label for="javascript">JavaScript</label><br>

            <input type="checkbox" id="react" name="temas" value="React">
            <label for="react">React</label>

            <br><br>

            <label for="nivelConocimiento">Nivel de Conocimiento:</label><br>
            <select id="nivelConocimiento" name="nivelConocimiento" required>
                <option value="">Seleccione una opción</option>
                <option value="basico">Básico</option>
                <option value="intermedio">Intermedio</option>
                <option value="avanzado">Avanzado</option>
            </select>

            <br><br>

            <label for="color">Color Favorito:</label><br>
            <input 
                type="color" 
                id="color" 
                name="color">
            <br><br>

            <label for="motivacion">Nivel de Motivación:</label><br>
            <input 
                type="range" 
                id="motivacion" 
                name="motivacion"
                min="1"
                max="10"
                step="1">
        </fieldset>

        <br>

        <!-- SECCIÓN 4 -->
        <fieldset>
            <legend>Disponibilidad</legend>

            <label for="fechaInicio">Fecha Preferida para Iniciar:</label><br>
            <input 
                type="date" 
                id="fechaInicio" 
                name="fechaInicio">
            <br><br>

            <label for="horaDisponible">Hora Disponible:</label><br>
            <input 
                type="time" 
                id="horaDisponible" 
                name="horaDisponible">
            <br><br>

            <label for="jornada">Jornada Preferida:</label><br>
            <select id="jornada" name="jornada">
                <option value="">Seleccione una opción</option>
                <option value="manana">Mañana</option>
                <option value="tarde">Tarde</option>
                <option value="noche">Noche</option>
            </select>
        </fieldset>

        <br>

        <!-- SECCIÓN 5 -->
        <fieldset>
            <legend>Información Adicional</legend>

            <label for="archivo">Subir CV:</label><br>
            <input 
                type="file" 
                id="archivo" 
                name="archivo">
            <br><br>

            <label for="portafolio">Perfil academico o Portafolio:</label><br>
            <input 
                type="url" 
                id="portafolio" 
                name="portafolio"
                placeholder="https://ejemplo.com">
            <br><br>

            <label for="comentarios">Comentarios al respecto:</label><br>
            <textarea 
                id="comentarios" 
                name="comentarios"
                rows="6"
                cols="50"
                maxlength="300"
                placeholder="Escriba aquí sus comentarios..."></textarea>
        </fieldset>

        <br>

        <!-- BOTONES -->
        <button type="submit">Enviar Inscripción</button>
        <button type="reset">Limpiar Formulario</button>

    </form>

</body>
</html>
